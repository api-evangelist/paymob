apis:
- aid: paymob:paymob-intentions-api
  name: Paymob Intentions API
  tags:
  - Payments
  - Intentions
  - Checkout
  - MENA
  humanURL: https://developers.paymob.com/paymob-docs/developers/intention-apis/create-intention
  properties:
  - url: https://developers.paymob.com/paymob-docs/developers/intention-apis/create-intention
    type: Documentation
  - url: https://docs.paymob.com/reference/next_v1_intentions_confirm_create
    type: APIReference
  - url: openapi/paymob-intentions-api-openapi.yml
    type: OpenAPI
  - url: json-schema/paymob-intention-schema.json
    type: JSONSchema
  - url: examples/paymob-create-intention-example.json
    type: Examples
  description: >-
    The v1 Intentions API is Paymob's modern entry point for payment acceptance. The merchant backend
    creates an intention with the secret key and an array of payment_methods (integration IDs or named
    methods like apple_pay, tabby, tamara, stc_pay, easypaisa, jazzcash). Paymob returns a client_secret
    used to launch the Unified Checkout, render the Pixel component, or confirm the payment headlessly.
- aid: paymob:paymob-subscriptions-api
  name: Paymob Subscriptions API
  tags:
  - Payments
  - Subscription
  - Recurring Billing
  tags_raw:
  - Payments
  - Subscriptions
  - Recurring Billing
  humanURL: https://developers.paymob.com
  properties:
  - url: https://developers.paymob.com
    type: Documentation
  - url: openapi/paymob-subscriptions-api-openapi.yml
    type: OpenAPI
  description: >-
    The Subscriptions Module manages subscription plans (create, list, update, suspend, resume) and per-customer
    subscriptions billed against tokenised cards. Lifecycle operations cover suspend, resume, cancel,
    secondary card attachment, and transaction inspection. Initial subscription creation flows through
    /v1/intention/ for card capture.
- aid: paymob:paymob-card-tokens-api
  name: Paymob Card Tokens API
  tags:
  - Payments
  - Card Tokens
  - Saved Cards
  - CIT
  - MIT
  humanURL: https://developers.paymob.com
  properties:
  - url: https://developers.paymob.com
    type: Documentation
  - url: openapi/paymob-card-tokens-api-openapi.yml
    type: OpenAPI
  description: >-
    Tokenisation surface for the Paymob "Pay with saved card" flow. Lists and deletes tokenised cards
    and runs both customer-initiated (CIT) and merchant-initiated (MIT) transactions against saved tokens
    for recurring, on-demand, and one-click payments.
