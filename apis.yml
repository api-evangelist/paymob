position: Consuming
description: >-
  Paymob is a Cairo-headquartered, licensed payment infrastructure provider for the MENAP region. Serving roughly
  390,000 merchants across Egypt, Saudi Arabia, the United Arab Emirates, Oman, and Pakistan (with Qatar announced),
  Paymob unifies card acquiring, regional mobile wallets (Vodafone Cash, Etisalat Cash, Orange Money, STC Pay, Oman Net,
  EasyPaisa, JazzCash), BNPL rails (Tabby, Tamara, valU, Souhoola, Forsa, Aman), Apple Pay, Google Pay, POS terminals,
  subscriptions, installments, marketplace payouts, mass disbursement (Paymob Send), and an end-to-end cashless commerce
  platform (Paymob Sync) behind a single Accept / Intentions API surface.
